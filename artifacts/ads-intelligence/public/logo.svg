<svg width="400" height="120" viewBox="0 0 400 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="logoGrad" x1="15" y1="15" x2="85" y2="85" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00D2FF" />
      <stop offset="100%" stop-color="#0066FF" />
    </linearGradient>
  </defs>
  <!-- Text 'Clic' -->
  <text x="30" y="78" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="52" fill="#08214D" letter-spacing="-1">Clic</text>
  
  <!-- 'Q' Icon in middle -->
  <g transform="translate(132, 22) scale(0.72)">
    <!-- Outer Ring -->
    <circle cx="46" cy="46" r="30" stroke="url(#logoGrad)" stroke-width="8" />
    <!-- Q Tail -->
    <line x1="66" y1="66" x2="80" y2="80" stroke="url(#logoGrad)" stroke-width="8" stroke-linecap="round" />
    <!-- Inner Ring -->
    <circle cx="46" cy="46" r="15" stroke="url(#logoGrad)" stroke-width="2.5" stroke-opacity="0.8" />
    <!-- Center Target Dot -->
    <circle cx="46" cy="46" r="5" fill="url(#logoGrad)" />
    <!-- Cursor Pointer -->
    <path d="M 47 47 L 47 58 L 51 54 L 58 61 L 61 58 L 54 51 L 58 47 Z" fill="#08214D" />
  </g>

  <!-- Text 'Lab' -->
  <text x="210" y="78" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="52" fill="#08214D" letter-spacing="-1">Lab</text>
</svg>
